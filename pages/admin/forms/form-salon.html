<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Crear Salones</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }

    /* Navbar */
    .navbar-rosa {
      background-color: #ee479a !important;
    }
    .navbar-rosa .navbar-brand {
      color: white;
      font-weight: 700;
      font-size: 1.8rem;
    }
    .navbar-rosa .navbar-brand:hover {
      color: #ffc1e3;
      text-decoration: none;
    }

    .btn-volver {
      background-color: #0abcc9;
      color: white;
      border-radius: 25px;
      padding: 0.4rem 1rem;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
    }
    .btn-volver:hover {
      background-color: #ad1457;
      box-shadow: 0 6px 10px rgba(0,0,0,0.3);
    }

    /* Botones */
    .btn-guardar {
      background-color: #28a745;
      color: white;
      border-radius: 25px;
      transition: background-color 0.3s ease;
    }
    .btn-guardar:hover {
      background-color: #218838;
      color: white;
    }

    /* Botón archivo imagen destacado en gris profesional */
    .btn-subir-img {
      background-color: #aab0b4; /* gris bootstrap */
      color: white;
      border-radius: 25px;
      padding: 0.375rem 0.75rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
      display: inline-block;
      text-align: center;
      user-select: none;
    }
    .btn-subir-img:hover {
      background-color: #5a6268;
      color: white;
    }
    /* Ocultar input file real y usar botón personalizado */
    #imagen {
      display: none;
    }
    #imagen-label {
      display: inline-block;
    }

    /* Formulario */
    .form-card {
      background-color: #f8f9fa;
      border-radius: 1rem;
      padding: 2rem;
      border: 2px solid #e3f2fd;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      max-width: 600px;
      margin: 3rem auto 0;
    }

    /* Título negro */
    h2.text-center {
      color: #000 !important;
    }

    /* Inputs borde normal */
    .form-control {
      border: 1.5px solid #555 !important;
      border-radius: 25px !important;
      transition: border-color 0.3s ease;
    }
    .form-control:focus {
      border-color: #ee479a !important; /* rosa navbar */
      box-shadow: 0 0 8px rgba(238,71,154,0.5);
    }
    /* Borde rojo al invalid */
    .form-control.invalid {
      border-color: #dc3545 !important;
      box-shadow: 0 0 8px rgba(220,53,69,0.7);
    }
    /* Mensajes de error */
    .error-msg {
      color: #dc3545;
      font-size: 0.875rem;
      margin-top: 0.25rem;
      font-weight: 600;
      display: none;
    }
    .error-msg.active {
      display: block;
    }

    /* Imagen preview */
    #imagenPreview {
      margin-top: 10px;
      max-width: 100%;
      max-height: 200px;
      display: none;
      border-radius: 0.5rem;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <!-- Navbar Crear Salones -->
  <nav class="navbar navbar-expand-lg navbar-rosa px-4">
    <a class="navbar-brand" href="#">Crear Salones</a>
    <div class="ms-auto d-flex gap-2">
      <a href="/index.html" class="btn btn-volver">
        <i class="bi bi-house-fill"></i> Inicio
      </a>
      <a href="/pages/admin/menu.html" class="btn btn-volver">
        <i class="bi bi-arrow-left-square-fill"></i> Panel Admin
      </a>
    </div>
  </nav>

  <main>
    <div class="form-card shadow-sm">
      <h2 id="tituloFormulario" class="text-center mb-4">Crear Salón</h2>
      <form id="form-salon" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input
            type="text"
            class="form-control"
            id="nombre"
            name="nombre"
            required
            pattern="^[a-zA-Z0-9\sáéíóúÁÉÍÓÚñÑüÜ]+$"
            placeholder="Ej: Salón Estelar"
            autocomplete="off"
          />
          <div id="nombre-error" class="error-msg">Solo se permiten letras y números, sin símbolos.</div>
        </div>

        <div class="mb-3">
          <label for="capacidad" class="form-label">Capacidad (personas)</label>
          <input
            type="number"
            class="form-control"
            id="capacidad"
            name="capacidad"
            required
            min="1"
            max="200"
            placeholder="Ej: 30"
          />
          <div id="capacidad-error" class="error-msg">Máximo 200 personas.</div>
        </div>

        <div class="mb-3">
          <label for="precio" class="form-label">Precio ($)</label>
          <input
            type="number"
            class="form-control"
            id="precio"
            name="precio"
            required
            min="0"
            step="0.01"
            placeholder="Ej: 1500.00"
          />
        </div>

        <div class="mb-3">
          <label for="imagen" class="form-label">Imagen</label><br/>
          <label for="imagen" id="imagen-label" class="btn-subir-img">
            <i class="fa fa-upload"></i> Seleccionar archivo
          </label>
          <span id="nombre-archivo" style="margin-left: 10px; font-style: italic; color: #555;">Ningún archivo seleccionado</span>
          <input type="file" id="imagen" name="imagen" accept="image/*" />
          <input type="hidden" id="imagenNombreGuardada" name="imagenNombreGuardada" value="">
          <img id="imagenPreview" alt="Vista previa de la imagen" />
        </div>

        <button type="submit" class="btn btn-guardar w-100">Guardar</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const STORAGE_KEY = "salones_data";

    const form = document.getElementById("form-salon");
    const nombreInput = document.getElementById("nombre");
    const capacidadInput = document.getElementById("capacidad");
    const precioInput = document.getElementById("precio");
    const imagenInput = document.getElementById("imagen");
    const nombreArchivoSpan = document.getElementById("nombre-archivo");
    const imagenNombreGuardada = document.getElementById("imagenNombreGuardada");
    const imagenPreview = document.getElementById("imagenPreview");
    const nombreError = document.getElementById("nombre-error");
    const capacidadError = document.getElementById("capacidad-error");
    const tituloFormulario = document.getElementById("tituloFormulario");

    function obtenerIdDesdeURL() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      console.log("ID a editar:", id);
      return id; // ← FALTABA ESTO
    }

    function cargarDatosSalon() {
      const id = obtenerIdDesdeURL();
      if (!id) return;

      const salones = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      const salon = salones.find(s => s.id === id);
      if (salon) {
        tituloFormulario.textContent = "Editar Salón";
        nombreInput.value = salon.nombre;
        capacidadInput.value = salon.capacidad;
        precioInput.value = salon.precio;
        imagenNombreGuardada.value = salon.imagen || "";
        if (salon.imagen) {
          imagenPreview.src = salon.imagen;
          imagenPreview.style.display = "block";
          nombreArchivoSpan.textContent = salon.imagen.split("/").pop();
        }
      }
    }

    function obtenerSiguienteId(salones) {
      if (salones.length === 0) return 1;
      const idsNumericos = salones.map(s => parseInt(s.id)).filter(id => !isNaN(id));
      const maxId = Math.max(...idsNumericos);
      return maxId + 1;
    }

    // Validaciones
    function validarNombre() {
      const regex = /^[a-zA-Z0-9\sáéíóúÁÉÍÓÚñÑüÜ]+$/;
      if (!nombreInput.value.trim() || !regex.test(nombreInput.value.trim())) {
        nombreInput.classList.add("invalid");
        nombreError.classList.add("active");
        return false;
      } else {
        nombreInput.classList.remove("invalid");
        nombreError.classList.remove("active");
        return true;
      }
    }

    function validarCapacidad() {
      const valor = parseInt(capacidadInput.value, 10);
      if (!valor || valor < 1 || valor > 200) {
        capacidadInput.classList.add("invalid");
        capacidadError.classList.add("active");
        return false;
      } else {
        capacidadInput.classList.remove("invalid");
        capacidadError.classList.remove("active");
        return true;
      }
    }

    nombreInput.addEventListener("input", validarNombre);
    capacidadInput.addEventListener("input", validarCapacidad);

    // Mostrar nombre de archivo seleccionado y vista previa
    imagenInput.addEventListener("change", () => {
      if (imagenInput.files.length > 0) {
        const archivo = imagenInput.files[0];
        nombreArchivoSpan.textContent = archivo.name;

        const reader = new FileReader();
        reader.onload = (e) => {
          imagenPreview.src = e.target.result;
          imagenPreview.style.display = "block";
        };
        reader.readAsDataURL(archivo);
      } else {
        nombreArchivoSpan.textContent = "Ningún archivo seleccionado";
        imagenPreview.src = "";
        imagenPreview.style.display = "none";
      }
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const esNombreValido = validarNombre();
      const esCapacidadValida = validarCapacidad();
      if (!esNombreValido || !esCapacidadValida) {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Por favor corrija los errores en el formulario.',
        });
        return;
      }

      const salones = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      const id = obtenerIdDesdeURL();
      const nombre = nombreInput.value.trim();
      const capacidad = parseInt(capacidadInput.value, 10);
      const precio = parseFloat(precioInput.value) || 0;

      // Manejo imagen
      let imagenData = imagenNombreGuardada.value || "";
      if (imagenInput.files.length > 0) {
        const reader = new FileReader();
        reader.onload = (event) => {
          imagenData = event.target.result;
          guardarSalon(id, nombre, capacidad, precio, imagenData);
        };
        reader.readAsDataURL(imagenInput.files[0]);
      } else {
        guardarSalon(id, nombre, capacidad, precio, imagenData);
      }
    });

    function guardarSalon(id, nombre, capacidad, precio, imagen) {
      let salones = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

      if (id) {
        const index = salones.findIndex(s => s.id === id);
        if (index !== -1) {
          salones[index] = { id, nombre, capacidad, precio, imagen };
        }
      } else {
        const nuevoId = obtenerSiguienteId(salones).toString();
        salones.push({ id: nuevoId, nombre, capacidad, precio, imagen });
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(salones));

      Swal.fire({
        icon: 'success',
        title: 'Éxito',
        text: 'Salón guardado correctamente.',
      }).then(() => {
        window.location.href = "/pages/admin/lists/list-salon.html";
      });
    }

    // ← Aquí va la llamada correcta
    cargarDatosSalon();
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Crear Servicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .navbar-rosa {
      background-color: #ee479a !important;
    }
    .navbar-brand {
      font-weight: bold;
      color: white;
    }
    .btn-volver {
      background-color: #0abcc9;
      color: white;
      border-radius: 25px;
      padding: 0.4rem 1rem;
    }
    .btn-guardar {
      background-color: #28a745;
      color: white;
      border-radius: 25px;
      transition: background-color 0.3s ease;
    }
    .form-card {
      background-color: #f8f9fa;
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      max-width: 600px;
      margin: 3rem auto 0;
    }
  </style>
</head>
<body>

  <!-- Navbar Crear Servicios -->
  <nav class="navbar navbar-expand-lg navbar-rosa px-4">
    <a class="navbar-brand" href="#">Crear Servicio</a>
    <div class="ms-auto d-flex gap-2">
      <a href="/index.html" class="btn btn-volver">
        <i class="bi bi-house-fill"></i> Inicio
      </a>
      <a href="/pages/admin/menu.html" class="btn btn-volver">
        <i class="bi bi-arrow-left-square-fill"></i> Panel Admin
      </a>
    </div>
  </nav>

  <main>
    <div class="form-card shadow-sm">
      <h2 class="text-center mb-4">Crear Servicio</h2>
      <form id="form-servicio" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input
            type="text"
            class="form-control"
            id="nombre"
            name="nombre"
            required
            placeholder="Ej: Animación para todas las edades"
            autocomplete="off"
          />
        </div>

        <div class="mb-3">
          <label for="tiempo" class="form-label">Tiempo (hs)</label>
          <input
            type="number"
            class="form-control"
            id="tiempo"
            name="tiempo"
            required
            min="1"
            placeholder="Ej: 2"
          />
        </div>

        <div class="mb-3">
          <label for="precio" class="form-label">Precio ($)</label>
          <input
            type="number"
            class="form-control"
            id="precio"
            name="precio"
            required
            min="0"
            step="0.01"
            placeholder="Ej: 5000"
          />
        </div>

        <button type="submit" class="btn btn-guardar w-100">Guardar</button>
      </form>
    </div>
  </main>

  <script src="/js/admin-servicio.js"></script>
  <script>
    // Obtener el formulario
    const formServicio = document.getElementById("form-servicio");

    // Función para manejar la creación del servicio
    formServicio.addEventListener("submit", function(event) {
      event.preventDefault();

      // Obtener los valores del formulario
      const nombre = document.getElementById("nombre").value;
      const tiempo = parseInt(document.getElementById("tiempo").value);
      const precio = parseFloat(document.getElementById("precio").value);

      // Validación simple
      if (!nombre || !tiempo || !precio) {
        Swal.fire("Error", "Por favor, complete todos los campos.", "error");
        return;
      }

      // Crear el servicio (en este caso usando la función agregarServicio)
      agregarServicio(nombre, tiempo, precio, "default.jpg"); // Usando una imagen por defecto

      // Mostrar mensaje de éxito
      Swal.fire({
        icon: "success",
        title: "¡Servicio guardado!",
        text: "El servicio se ha guardado correctamente.",
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true,
      }).then(() => {
        // Redirigir a la lista de servicios
        window.location.href = "/pages/admin/lists/list-servicio.html";
      });
    });
  </script>

</body>
</html>

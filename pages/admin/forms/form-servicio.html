<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Formulario Servicio</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .form-card { background-color: #fff0f5; border-radius: 1rem; padding: 2rem; border: 2px solid #f8bbd0; }
    .btn-primary { background-color: #f06292; border-color: #f06292; }
    .btn-success { background-color: #64b5f6; border-color: #64b5f6; }
    .btn-danger { background-color: #e57373; border-color: #e57373; }
    .table thead { background-color: #fce4ec; color: #ad1457; }
  </style>
</head>
<body class="container py-4">

  <h2 class="text-center text-danger mb-4">Crear Servicio</h2>

  <div class="form-card shadow-sm">
    <form id="formServicio">
      <div class="mb-3">
        <label for="nombreServicio" class="form-label">Nombre</label>
        <input type="text" class="form-control rounded-pill" id="nombreServicio" required pattern="^[a-zA-Z0-9\s]+$" placeholder="Ej: Animación infantil" />
      </div>
      <div class="mb-3">
        <label for="tiempoServicio" class="form-label">Tiempo (hs)</label>
        <input type="number" class="form-control rounded-pill" id="tiempoServicio" required min="1" max="12" />
      </div>
      <div class="mb-3">
        <label for="precioServicio" class="form-label">Precio ($)</label>
        <input type="number" class="form-control rounded-pill" id="precioServicio" required />
      </div>
      <div class="mb-3">
        <label for="imagenServicio" class="form-label">Imagen</label>
        <input type="file" class="form-control" id="imagenServicio" accept="image/*" />
      </div>
      <button type="submit" class="btn btn-primary rounded-pill">Guardar</button>
    </form>
  </div>

  <hr class="my-4" />

  <h4 class="text-center text-muted">Lista de Servicios</h4>
  <div class="table-responsive">
    <table class="table table-bordered table-striped mt-3">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Tiempo</th>
          <th>Precio</th>
          <th>Imagen</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Animación infantil</td>
          <td>3</td>
          <td>$8000</td>
          <td><img src="../../img/servicio1.jpg" width="60" /></td>
          <td>
            <button class="btn btn-success btn-sm">Editar</button>
            <button class="btn btn-danger btn-sm">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <script src="../../js/admin-servicio.js"></script>
</body>
</html>

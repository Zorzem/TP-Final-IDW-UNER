<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Formulario Imagen</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .navbar-rosa {
      background-color: #ee479a !important;
    }
    .navbar-rosa .navbar-brand {
      color: white;
      font-weight: 700;
      font-size: 1.8rem;
    }
    .navbar-rosa .navbar-brand:hover {
      color: #ffc1e3;
      text-decoration: none;
    }
    .btn-volver {
      background-color: #0abcc9;
      color: white;
      border-radius: 25px;
      padding: 0.4rem 1rem;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
    }
    .btn-volver:hover {
      background-color: #ad1457;
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3);
    }
    .form-card {
      background-color: #f8f9fa;
      border-radius: 1rem;
      padding: 2rem;
      border: 2px solid #e3f2fd;
      max-width: 480px;
      margin: 2rem auto;
      box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
    }
    .btn-primary {
      background-color: #64b5f6;
      border-color: #64b5f6;
      border-radius: 25px;
      font-weight: 700; /* negrita para el texto del botón */
      padding: 0.5rem 1.5rem;
      transition: background-color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-primary:hover {
      background-color: #4285f4;
      border-color: #4285f4;
    }
    .form-label {
      font-weight: 600;
    }
    .invalid-feedback {
      display: block;
      color: #333 !important; /* gris oscuro */
    }
    h2 strong {
      font-weight: 700; /* negrita */
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-rosa px-4">
    <a class="navbar-brand" href="#">Imágenes</a>
    <div class="ms-auto d-flex gap-2">
      <a href="/index.html" class="btn btn-volver">
        <i class="bi bi-house-fill"></i> Inicio
      </a>
      <a href="/pages/admin/menu.html" class="btn btn-volver">
        <i class="bi bi-arrow-left-square-fill"></i> Panel Admin
      </a>
    </div>
  </nav>

  <main>
    <div class="form-card shadow-sm">
      <h2 class="text-center text-info mb-4"><strong>Subir Imagen</strong></h2>
      <form id="formImagen" novalidate>
        <div class="mb-3">
          <label for="nombreImagen" class="form-label">Nombre de la Imagen</label>
          <input
            type="text"
            class="form-control rounded-pill"
            id="nombreImagen"
            name="nombreImagen"
            required
            pattern="^[a-zA-Z0-9\s]+$"
            placeholder="Ej: Decoración Rosa"
          />
          <div class="invalid-feedback">
            Por favor ingresa un nombre válido sin caracteres especiales.
          </div>
        </div>

        <div class="mb-3">
          <label for="archivo" class="form-label">Archivo (jpg/png menor a 1MB)</label>
          <input
            type="file"
            class="form-control"
            id="archivo"
            name="archivo"
            accept=".jpg, .jpeg, .png"
            required
          />
          <div class="invalid-feedback" id="errorArchivo"></div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary rounded-pill">
            <i class="bi bi-upload"></i> <strong>Subir Imagen</strong>
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    (() => {
      const form = document.getElementById("formImagen");
      const nombreInput = form.nombreImagen;
      const archivoInput = form.archivo;
      const errorArchivo = document.getElementById("errorArchivo");

      function validarArchivo(file) {
        const tiposPermitidos = ["image/jpeg", "image/png"];
        const maxSizeBytes = 1 * 1024 * 1024; // 1 MB

        if (!file) {
          errorArchivo.textContent = "Debes seleccionar una imagen.";
          return false;
        }
        if (!tiposPermitidos.includes(file.type)) {
          errorArchivo.textContent =
            "Formato no válido. Solo jpg y png son permitidos.";
          return false;
        }
        if (file.size > maxSizeBytes) {
          errorArchivo.textContent =
            "El archivo es muy grande. Máximo permitido: 1 MB.";
          return false;
        }
        errorArchivo.textContent = "";
        return true;
      }

      // Obtener siguiente ID (máximo + 1) para las imágenes
      function obtenerSiguienteIdImagen() {
        const imagenes = JSON.parse(localStorage.getItem("imagenes_data")) || [];
        if (imagenes.length === 0) return 1;
        const maxId = imagenes.reduce((max, img) => (img.id > max ? img.id : max), 0);
        return maxId + 1;
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        // Validar nombre (pattern y required)
        if (!nombreInput.checkValidity()) {
          nombreInput.classList.add("is-invalid");
        } else {
          nombreInput.classList.remove("is-invalid");
        }

        // Validar archivo
        const archivoValido = validarArchivo(archivoInput.files[0]);
        if (!archivoValido) {
          archivoInput.classList.add("is-invalid");
        } else {
          archivoInput.classList.remove("is-invalid");
        }

        // Si todo válido
        if (form.checkValidity() && archivoValido) {
          // Leer el archivo y convertirlo a base64 para guardar en localStorage
          const reader = new FileReader();
          reader.onload = function (e) {
            // Obtener array de imágenes guardadas o crear uno vacío
            let imagenes = JSON.parse(localStorage.getItem("imagenes_data")) || [];

            // Crear nuevo objeto imagen
            const nuevaImagen = {
              id: obtenerSiguienteIdImagen(), // ID secuencial
              nombre: nombreInput.value.trim(),
              archivoBase64: e.target.result, // la imagen codificada en base64
            };

            // Añadir la nueva imagen al array
            imagenes.push(nuevaImagen);

            // Guardar en localStorage
            localStorage.setItem("imagenes_data", JSON.stringify(imagenes));

            // Mostrar mensaje y redirigir
            Swal.fire({
              icon: "success",
              title: "Imagen subida con éxito",
              showConfirmButton: false,
              timer: 2000,
            }).then(() => {
              window.location.href = "/pages/admin/lists/list-imagen.html";
            });
          };
          reader.readAsDataURL(archivoInput.files[0]); // convertir a base64
        }

        // Remover estilos invalidos al corregir
        nombreInput.addEventListener("input", () => {
          if (nombreInput.checkValidity()) {
            nombreInput.classList.remove("is-invalid");
          }
        });

        archivoInput.addEventListener("change", () => {
          validarArchivo(archivoInput.files[0]);
          if (archivoInput.files.length && validarArchivo(archivoInput.files[0])) {
            archivoInput.classList.remove("is-invalid");
          }
        });
      });
    })();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Formulario Imagen</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .form-card { background-color: #f8f9fa; border-radius: 1rem; padding: 2rem; border: 2px solid #e3f2fd; }
    .btn-primary { background-color: #64b5f6; border-color: #64b5f6; }
    .btn-danger { background-color: #f06292; border-color: #f06292; }
    .table thead { background-color: #e1f5fe; color: #0288d1; }
  </style>
</head>
<body class="container py-4">

  <h2 class="text-center text-info mb-4">Subir Imagen</h2>

  <div class="form-card shadow-sm">
    <form id="formImagen">
      <div class="mb-3">
        <label for="nombreImagen" class="form-label">Nombre de la Imagen</label>
        <input type="text" class="form-control rounded-pill" id="nombreImagen" required pattern="^[a-zA-Z0-9\s]+$" placeholder="Ej: Decoración Rosa" />
      </div>
      <div class="mb-3">
        <label for="archivo" class="form-label">Archivo</label>
        <input type="file" class="form-control" id="archivo" accept="image/*" required />
      </div>
      <button type="submit" class="btn btn-primary rounded-pill">Subir Imagen</button>
    </form>
  </div>

  <hr class="my-4" />

  <h4 class="text-center text-secondary">Galería de Imágenes</h4>
  <div class="table-responsive">
    <table class="table table-bordered mt-3">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Imagen</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="imagenTableBody">
        <!-- Contenido dinámico cargado por JS -->
      </tbody>
    </table>
  </div>

  <!-- Aquí se carga el script -->
  <script src="../../js/admin-imagen.js"></script>
</body>
</html>

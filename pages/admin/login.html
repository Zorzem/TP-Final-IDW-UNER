<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Planeta Fiesta</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card shadow">
          <div class="card-body">
            <h4 class="card-title text-center mb-4">Iniciar sesión</h4>

            <form id="loginForm">
              <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" required placeholder="emilys" />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required placeholder="emilyspass" />
              </div>
              <button type="submit" class="btn btn-primary w-100">Ingresar</button>
              <hr>
              <button onclick="window.location.href='../../index.html'" type="" class="btn btn-secondary w-100">← Regresar a inicio</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/login.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Planeta Fiesta</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background: linear-gradient(135deg, #cae2ff, #24d8c3);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 0;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 0;
    }

    .login-container {
      background-color: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      display: flex;
      max-width: 900px;
      width: 100%;
      overflow: hidden;
      flex-wrap: wrap;
    }

    .login-left {
      background: linear-gradient(to bottom left, #ff54e5, #ff6f91);
      padding: 4rem 2rem;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 250px;
    }

    .login-left img {
      width: 150px;
      border-radius: 1rem;
    }

    .login-right {
      flex: 1;
      padding: 4rem 3rem;
      min-width: 300px;
      position: relative;
    }

    .input-icon {
      position: relative;
    }

    .input-icon > .bi-person-fill,
    .input-icon > .bi-lock-fill {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 1.2rem;
      pointer-events: none;
    }

    .input-icon input.form-control {
      padding-left: 2.5rem;
      padding-right: 2.5rem;
      border: none;
      border-bottom: 1px solid #ccc;
      border-radius: 0;
      background-color: transparent;
    }

    .forgot-password {
      color: #ff6f91;
      font-size: 0.9rem;
      text-align: right;
      display: block;
      margin-top: 0.25rem;
      text-decoration: none;
      cursor: pointer;
      user-select: text;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #999;
      font-size: 1.2rem;
      user-select: none;
    }

    .btn-login {
      background-color: #ff6f91;
      color: white;
      border-radius: 30px;
      padding: 10px 30px;
      font-weight: bold;
      transition: 0.3s;
      border: none;
    }

    .btn-login:hover {
      background-color: #ff4575;
    }

    /* Credenciales ejemplo */
    .credenciales {
      margin-top: 2rem;
      padding: 0;
      font-size: 0.95rem;
      color: #333;
      background: transparent;
      box-shadow: none;
      user-select: auto;
    }

    .credenciales strong {
      display: inline-block;
      width: 100px;
      color: #ff6f91;
    }

    .forgot-password {
      color: #ff6f91;
      font-size: 0.9rem;
      text-align: right;
      display: block;
      margin-top: 0.25rem;
      text-decoration: none;
      cursor: pointer;
      user-select: text;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }


    /* Navbar */
    .custom-navbar {
      background-color: rgb(255, 77, 172);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
    }

    .navbar-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: center;
    }

    .navbar-nav {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .navbar-brand img {
      height: 40px;
    }

    .navbar-nav .nav-link {
      color: #ffffff;
      font-weight: 500;
      margin-left: 15px;
      transition: color 0.3s ease;
    }

    .navbar-nav .nav-link:hover {
      color: #dfdfdf;
    }

    /* Footer */
    .footer-mejorado {
      background-color: #ae24d8;
      color: #fff;
      padding: 20px 10px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <header>
    <nav class="navbar navbar-expand-lg custom-navbar">
      <div class="container-fluid navbar-content">
        <a class="navbar-brand logo" href="../../index.html">
          <img src="../../img/logo.png" alt="Logo Planeta Fiesta" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="../../index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="../institucional.html">Institucional</a></li>
            <li class="nav-item"><a class="nav-link" href="../contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- FORMULARIO DE LOGIN -->
  <main>
    <div class="login-container">
      <!-- Lado izquierdo (rosa) -->
      <div class="login-left">
        <img src="../../img/logo.png" alt="Logo Planeta Fiesta" />
      </div>

      <!-- Lado derecho (formulario) -->
      <div class="login-right">
        <h3 class="text-center fw-bold mb-4">Iniciar sesión</h3>

        <form id="loginForm" autocomplete="off">
          <div class="mb-4 input-icon">
            <i class="bi bi-person-fill"></i>
            <input type="text" id="username" class="form-control" placeholder="Usuario" required />
          </div>

          <div class="mb-4 input-icon">
            <i class="bi bi-lock-fill"></i>
            <input type="password" id="password" class="form-control" placeholder="Contraseña" required />
            <i class="bi bi-eye toggle-password" id="togglePassword"></i>
          </div>
          
          <div class="text-center mt-4">
            <button type="submit" class="btn btn-login">Iniciar sesión</button>
          </div>
        </form>

          <div class="credenciales">
            <p><strong>Credencial:</strong></p>
            <p><strong>Usuario:</strong>emilys</p>
            <p><strong>Contraseña:</strong>emilyspass</p>
          </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer-mejorado mt-5">
    <div class="footer-contenido">
      <form class="newsletter-form">
        <h3>¡Suscribite a nuestro newsletter!</h3>
        <div class="newsletter-input-group">
          <input type="email" id="email" placeholder="Tu correo electrónico" required />
          <button type="button" class="btn-lg">Suscribirse</button>
        </div>
      </form>

      <div class="redes-sociales">
        <a href="https://www.instagram.com" target="_blank" aria-label="Instagram">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" />
        </a>
        <a href="https://www.facebook.com" target="_blank" aria-label="Facebook">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" alt="Facebook" />
        </a>
        <a href="mailto:planeta.fiesta@planetafiesta.com" aria-label="Gmail">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg" alt="Gmail" />
        </a>
        <a href="https://wa.me/549123456789" target="_blank" aria-label="WhatsApp">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg" alt="WhatsApp" />
        </a>
      </div>

      <p class="copyright">Planeta Fiesta © 2025 - Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

</body>
  <script src="../../js/login.js"></script>
</html>

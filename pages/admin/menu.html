<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin | Planeta Fiesta</title>

  <link rel="stylesheet" href="../../css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="shortcut icon" href="../../img/favicon.png" type="image/x-icon">

  <script type="text/javascript" src="../../js/admin-salon.js"></script>
  <script type="text/javascript" src="../../js/admin-servicio.js"></script>
  <script type="text/javascript" src="../../js/admin-imagen.js"></script>
  <script type="text/javascript" src="../../js/admin-usuarios.js"></script>
  <script type="text/javascript" src="../../js/admin-presupuestos.js"></script>
</head>

<body>

  <script>
    // redirigir a página de login si no inició sesión
    const token = sessionStorage.getItem("accessToken");
    /* console.log("menu.html:\n", token) prueba*/
    if (!token || token === "undefined" || token === "null") {
      window.location.href = "login.html";
    }

  </script>

  <!-- NAVBAR -->
  <header>
    <nav class="navbar navbar-expand-lg custom-navbar">
      <div class="container-fluid navbar-content">
        <a class="navbar-brand logo" href="../../index.html">
          <img src="../../img/logo.png" alt="Logo Planeta Fiesta" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="../../index.html">Volver a inicio</a></li>
            <button class="btn btn-danger ms-2" onclick="borrarLocalStorage()">
              Reiniciar datos
            </button>
            <button class="btn btn-danger ms-2" id="cerrar-sesion">
              Cerrar sesión
            </button>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container-fluid mt-4">
    <div class="row">
      <h2 id="usuario-nombre" class="text-center mb-4">Menu de Administración</h2>

      <aside class="col-md-3 bg-light p-3 shadow-sm border">
        <!-- SALONES -->
        <div class="accordion mb-2" id="sidebarMenuSalones">
          <div class="accordion-item">
            <h2 class="accordion-header" id="salonesHeading">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#salonesCollapse">
                <i class="bi bi-houses me-2"></i>Salones
              </button>
            </h2>
            <div id="salonesCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarMenuSalones">
              <div class="accordion-body list-group">
                <button class="list-group-item list-group-item-action" onclick="cargarVista('salones', 'listar')">Listar</button>
                <button class="list-group-item list-group-item-action" onclick="cargarVista('salones', 'crear')">Crear</button>
              </div>
            </div>
          </div>
        </div>

        <!-- SERVICIOS -->
        <div class="accordion mb-2" id="sidebarMenuServicios">
          <div class="accordion-item">
            <h2 class="accordion-header" id="serviciosHeading">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#serviciosCollapse">
                <i class="bi bi-balloon me-2"></i>Servicios
              </button>
            </h2>
            <div id="serviciosCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarMenuServicios">
              <div class="accordion-body list-group">
                <button class="list-group-item list-group-item-action" onclick="cargarVistaServicios('servicios', 'listar')">Listar</button>
                <button class="list-group-item list-group-item-action" onclick="cargarVistaServicios('servicios', 'crear')">Crear</button>
              </div>
            </div>
          </div>
        </div>

        <!-- IMÁGENES -->
        <div class="accordion mb-2" id="sidebarMenuImagenes">
          <div class="accordion-item">
            <h2 class="accordion-header" id="imagenesHeading">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#imagenesCollapse">
                <i class="bi bi-image me-2"></i>Imágenes
              </button>
            </h2>
            <div id="imagenesCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarMenuImagenes">
              <div class="accordion-body list-group">
                <button class="list-group-item list-group-item-action" onclick="cargarVista('imagenes', 'listar')">Listar</button>
                <button class="list-group-item list-group-item-action" onclick="cargarVista('imagenes', 'crear')">Crear</button>
              </div>
            </div>
          </div>
        </div>

        <!-- USUARIOS -->
        <div class="accordion mb-2" id="sidebarMenuUsuarios">
          <div class="accordion-item">
            <h2 class="accordion-header" id="usuariosHeading">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#usuariosCollapse">
                <i class="bi bi-people me-2"></i>Usuarios
              </button>
            </h2>
            <div id="usuariosCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarMenuUsuarios">
              <div class="accordion-body list-group">
                <button class="list-group-item list-group-item-action" onclick="cargarVista('usuarios', 'listar')">Listar Usuarios</button>
              </div>
            </div>
          </div>
        </div>

        <!-- PRESUPUESTOS -->
        <div class="accordion mb-2" id="sidebarMenuPresupuestos">
          <div class="accordion-item">
            <h2 class="accordion-header" id="presupuestosHeading">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#presupuestosCollapse">
                <i class="bi bi-receipt me-2"></i>Presupuestos
              </button>
            </h2>
            <div id="presupuestosCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarMenuPresupuestos">
              <div class="accordion-body list-group">
                <button class="list-group-item list-group-item-action" onclick="cargarVistaPresupuesto('presupuestos', 'listar')">Listar</button>
                <button class="list-group-item list-group-item-action" onclick="cargarVistaPresupuesto('presupuestos', 'crear')">Crear</button>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Contenido dinámico -->
      <section class="col-md-9" id="contenido-admin">
        <h5>Este es el panel de administración</h5>
        <p>Seleccioná una opción del menú lateral para comenzar.</p>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous">  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    const username = sessionStorage.getItem("username");
    // console.log(username)

    // mostrar nombre de usuario iniciado
    if (username) {
      document.querySelector("#usuario-nombre").innerHTML = `Hola, <b>${username}</b>.`;
    }

    document.querySelector("#cerrar-sesion").addEventListener("click", () => {
      sessionStorage.removeItem("accessToken");

      // popup al cerrar sesión
      Swal.fire({
        title: "Sesión cerrada",
        text: "Redirigiendo al inicio...",
        icon: "success",
        confirmButtonText: "Aceptar",
      })

      setTimeout(() => {
        window.location.href = "../../index.html";
      }, 3000);

    });

    // para revertir los cambios del localStorage fácilmente
    function borrarLocalStorage() {

      Swal.fire({
        title: "Borrar el localStorage?",
        text: "Esta acción eliminará todos los datos del localStorage y no se puede deshacer",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Sí, borrar",
        cancelButtonText: "Cancelar"
      }).then((result) => {
        if (result.isConfirmed) {
          localStorage.clear()
        }
      });


    }

  </script>

</body>

</html>

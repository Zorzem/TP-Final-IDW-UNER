<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu de Administración | Planeta Fiesta</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script type="text/javascript" src="../../js/admin-salon.js"></script>
    <script type="text/javascript" src="../../js/admin-servicio.js"></script>
  </head>

  <body>
    <!-- NAVBAR -->
    <header>
      <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid navbar-content">
          <a class="navbar-brand logo" href="../../index.html">
            <img src="../../img/logo.png" alt="Logo Planeta Fiesta" />
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="../..//index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="../../index.html#salones">Catálogo</a></li>
              <li class="nav-item"><a class="nav-link" href="../institucional.html">Institucional</a></li>
              <li class="nav-item"><a class="nav-link" href="../contacto.html">Contacto</a></li>
              <a href="#" class="btn btn-outline-dark">ADMIN</a>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container-fluid mt-4">
        <div class="row">
            <h2 class="text-center mb-4">Menu de Administración</h2>

            <!-- Sidebar --> <!-- SALONES -->
            <aside class="col-md-3 bg-light p-3 shadow-sm border">
                <div class="accordion" id="sidebarMenuSalones">
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="salonesHeading">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" 
                                    data-bs-target="#salonesCollapse">
                                <i class="bi bi-houses me-2"></i>Salones
                            </button>
                        </h2>
                        
                        <div id="salonesCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarMenuSalones">
                            <div class="accordion-body list-group">
                                <button class="list-group-item list-group-item-action" 
                                        onclick="cargarVista('salones', 'listar')">Listar</button>
                                <button class="list-group-item list-group-item-action" 
                                        onclick="cargarVista('salones', 'crear')">Crear</button>
                            </div>                
                    </div>
                </div>
                <!-- Sidebar --> <!-- SERVICIOS MENU  -->
                <div class="accordion" id="sidebarMenuServicios">
                    <div class="accordion-item">        
                        <h2 class="accordion-header" id="serviciosHeading">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" 
                                    data-bs-target="#serviciosCollapse">
                                <i class="bi bi-balloon me-2"></i>Servicios
                            </button>
                        </h2>
                        <!-- SERVICIOS LISTA -->
                        <div id="serviciosCollapse" class="accordion-collapse collapse" data-bs-parent="#sidebarMenuServicios">
                            <div class="accordion-body list-group">
                                <button class="list-group-item list-group-item-action" 
                                        onclick="cargarVistaServicios('servicios', 'listar')">Listar</button>
                                <button class="list-group-item list-group-item-action" 
                                        onclick="cargarVistaServicios('servicios', 'crear')">Crear</button>
                            </div>

                        </div>
                    </div>
                </div>

            </aside>

            <!-- Contenido dinámico -->
            <section class="col-md-9" id="contenido-admin">
                <h5>Bienvenido al panel de administración</h5>
                <p>Seleccioná una opción del menú lateral para comenzar.</p>
            </section>
        </div>
    </main>
    
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous">
    </script>



</body>
</html>

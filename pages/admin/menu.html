<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel Administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { padding-top: 70px; background: #f9fafd; }

    /* Navbar rosa */
    .navbar-rosa {
      background-color: #ee479a !important; /* rosa fuerte */
    }
    .navbar-rosa .navbar-brand {
      color: white;
      font-weight: 700; /* negrita */
      font-size: 1.8rem; /* más grande */
    }
    .navbar-rosa .navbar-brand:hover {
      color: #ffc1e3;
      text-decoration: none;
    }

    /* Botones centrales */
    .center-buttons {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 4rem;
      flex-wrap: wrap;
    }
    .center-buttons a.btn {
      padding: 1.5rem 3rem;
      font-size: 1.5rem;
      border-radius: 50px;
      color: white;
      font-weight: 600;
      text-align: center;
      transition: background-color 0.3s ease;
      min-width: 180px;
      box-shadow: 0 4px 8px rgb(0 0 0 / 0.15);
      text-decoration: none;
    }
    .btn-salones {
      background-color: #c270e0;
    }
    .btn-salones:hover {
      background-color: #9447e6;
      color: white;
      text-decoration: none;
    }
    .btn-imagenes {
      background-color: #5099ee;
    }
    .btn-imagenes:hover {
      background-color: #2677e0;
      color: white;
      text-decoration: none;
    }
    .btn-servicios {
      background-color: #eaa14d;
    }
    .btn-servicios:hover {
      background-color: #e56c34;
      color: white;
      text-decoration: none;
    }

    .btn-volver {
      background-color: #0abcc9;
      color: white;
      border-radius: 25px;
      padding: 0.4rem 1rem;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
    }
    .btn-volver:hover {
      background-color: #05b1c4;
      color: white;
      box-shadow: 0 6px 10px rgba(0,0,0,0.3);
      text-decoration: none;
    }

    /* Texto de bienvenida y descripción */
    .welcome-text {
      margin-top: 3rem;
      font-weight: 700;
      font-size: 2.2rem;
      color: #333;
    }
    .description-text {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #555;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .start-text {
      margin-top: 2rem;
      font-size: 1.3rem;
      font-weight: 600;
      color: #444;
    }

  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-rosa fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Panel Admin</a>

    <div class="d-flex">
      <a href="/index.html" class="btn btn-volver">Volver a inicio <i class="fa fa-home ms-1"></i></a>
    </div>
  </div>
</nav>

<main class="container text-center">
  <div class="center-buttons">
    <a href="lists/list-salon.html" class="btn btn-salones">Salones</a>
    <a href="lists/list-imagen.html" class="btn btn-imagenes">Imágenes</a>
    <a href="lists/list-servicio.html" class="btn btn-servicios">Servicios</a>
  </div>

  <div class="welcome-text">Bienvenidos al panel de administración</div>

  <div class="description-text">
    Este panel administrativo te permite gestionar salones, imágenes y servicios de manera integral, facilitando la organización y planificación eficiente de tus recursos.
  </div>

  <div class="start-text">Elige una opción para comenzar.</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/admin-salon.js"></script>
<script src="js/admin-servicio.js"></script>
<script src="js/admin-imagen.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Listado de Imágenes | Admin Planeta Fiesta</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }
    .navbar-rosa {
      background-color: #ee479a !important;
    }
    .navbar-rosa .navbar-brand {
      color: white;
      font-weight: 700;
      font-size: 1.8rem;
    }
    .navbar-rosa .navbar-brand:hover {
      color: #ffc1e3;
      text-decoration: none;
    }
    .btn-volver {
      background-color: #0abcc9;
      color: white;
      border-radius: 25px;
      padding: 0.4rem 1rem;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
    }
    .btn-volver:hover {
      background-color: #ad1457;
      box-shadow: 0 6px 10px rgba(0,0,0,0.3);
    }
    .btn-create {
      background-color: #38d15b;
      color: white;
    }
    .btn-edit {
      background-color: #ffc107;
      color: black;
    }
    .btn-delete {
      background-color: #dc3545;
      color: white;
    }
    .table th {
      background-color: #98e6eb;
      color: black;
    }
    .table-img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 0.25rem;
    }
    h2 {
      color: #333;
    }
    .pagination .page-link {
      color: #000;
    }
    .pagination .active .page-link {
      background-color: #000;
      border-color: #000;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Navbar igual que list-salon.html -->
  <nav class="navbar navbar-expand-lg navbar-rosa px-4">
    <a class="navbar-brand" href="#">Imágenes</a>
    <div class="ms-auto d-flex gap-2">
      <a href="/index.html" class="btn btn-volver">
        <i class="bi bi-house-fill"></i> Inicio
      </a>
      <a href="/pages/admin/menu.html" class="btn btn-volver">
        <i class="bi bi-arrow-left-square-fill"></i> Panel Admin
      </a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <a href="/pages/admin/forms/form-imagen.html" class="btn btn-create">
        <i class="bi bi-plus-circle"></i> Crear Imagen
      </a>
    </div>

    <div class="table-responsive shadow rounded">
      <table class="table table-striped table-hover text-center align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Imagen</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="imagenes-body">
          <!-- Filas se cargan dinámicamente -->
        </tbody>
      </table>
    </div>

    <nav class="d-flex justify-content-center mt-4">
      <ul class="pagination pagination-sm">
        <li class="page-item disabled"><a class="page-link" href="#">Anterior</a></li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">Siguiente</a></li>
      </ul>
    </nav>
  </main>

  <script src="/js/admin-imagen.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Obtener las imágenes guardadas en el localStorage
    function cargarImagenes() {
      const imagenes = JSON.parse(localStorage.getItem("imagenes_data")) || [];
      const tbody = document.getElementById("imagenes-body");
      if (!tbody) {
        console.error("No se encontró el tbody con id 'imagenes-body'");
        return;
      }
      tbody.innerHTML = "";

      imagenes.forEach((imagen) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${imagen.id}</td>
            <td>${imagen.nombre}</td>
            <td><img src="../../img/${imagen.archivo}" class="table-img" alt="${imagen.nombre}"></td>
            <td>
              <button class="btn btn-edit btn-sm me-2" onclick="confirmarAccionImagen('editar', ${imagen.id})">
                <i class="bi bi-pencil-fill"></i> Editar
              </button>
              <button class="btn btn-delete btn-sm" onclick="confirmarAccionImagen('eliminar', ${imagen.id})">
                <i class="bi bi-trash-fill"></i> Eliminar
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });

    }

    // Confirmar acción de editar o eliminar imagen
    function confirmarAccion(accion, id) {
      if (accion === "eliminar") {
        Swal.fire({
          title: "¿Estás seguro de eliminar esta imagen?",
          text: "No podrás revertir esta acción.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Sí, eliminar",
          cancelButtonText: "Cancelar",
          confirmButtonColor: "#dc3545"
        }).then((result) => {
          if (result.isConfirmed) {
            eliminarImagen(id);
            Swal.fire("Eliminado!", "La imagen ha sido eliminada.", "success");
          }
        });
      }
    }

    // Eliminar imagen por ID
    function eliminarImagen(id) {
      let imagenes = JSON.parse(localStorage.getItem("imagenes_data")) || [];
      imagenes = imagenes.filter((img) => img.id !== id);
      localStorage.setItem("imagenes_data", JSON.stringify(imagenes));
      cargarImagenes();
    }

    // Al cargar la página, inicializar y cargar las imágenes
    window.addEventListener("DOMContentLoaded", () => {
      cargarImagenes();
    });
  </script>

</body>
</html>

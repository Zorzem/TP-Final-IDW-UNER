<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lista de Imágenes | Admin Planeta Fiesta</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <style>
    body {
      background: #f9faff;
      color: #333;
    }
    .table thead {
      background: #e29ccd; /* rosa */
      color: #fff;
    }
    .table-striped tbody tr:nth-of-type(odd) {
      background-color: #f5d9e1;
    }
    .btn-edit {
      background-color: #4caf50;
      color: white;
    }
    .btn-delete {
      background-color: #f44336;
      color: white;
    }
    .table-img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 5px;
    }
    h2 {
      color: #d6336c;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <main class="container my-4">
    <h2 class="text-center">Lista de Imágenes</h2>
    <div class="table-responsive shadow rounded">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Imagen</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Imagen Fiesta 1</td>
            <td><img src="../../img/imagenes/imagen1.jpg" alt="Imagen Fiesta 1" class="table-img" /></td>
            <td class="text-center">
              <button class="btn btn-edit btn-sm me-2" data-bs-toggle="tooltip" title="Editar">
                <i class="bi bi-pencil-fill"></i>
              </button>
              <button class="btn btn-delete btn-sm" data-bs-toggle="tooltip" title="Eliminar">
                <i class="bi bi-trash-fill"></i>
              </button>
            </td>
          </tr>
          <!-- Más filas de ejemplo -->
          <tr>
            <td>2</td>
            <td>Imagen Fiesta 2</td>
            <td><img src="../../img/imagenes/imagen2.jpg" alt="Imagen Fiesta 2" class="table-img" /></td>
            <td class="text-center">
              <button class="btn btn-edit btn-sm me-2" data-bs-toggle="tooltip" title="Editar">
                <i class="bi bi-pencil-fill"></i>
              </button>
              <button class="btn btn-delete btn-sm" data-bs-toggle="tooltip" title="Eliminar">
                <i class="bi bi-trash-fill"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav aria-label="Page navigation example" class="mt-3">
      <ul class="pagination justify-content-center">
        <li class="page-item disabled"><a class="page-link" href="#">Anterior</a></li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">Siguiente</a></li>
      </ul>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    tooltipTriggerList.map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
  </script>
</body>
</html>

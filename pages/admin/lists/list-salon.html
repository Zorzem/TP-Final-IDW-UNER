<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listado de Salones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .navbar-rosa {
      background-color: #ee479a !important;
    }
    .navbar-rosa .navbar-brand {
      color: white;
      font-weight: 700;
      font-size: 1.8rem;
    }
    .navbar-rosa .navbar-brand:hover {
      color: #ffc1e3;
      text-decoration: none;
    }
    .btn-volver {
      background-color: #0abcc9;
      color: white;
      border-radius: 25px;
      padding: 0.4rem 1rem;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
    }
    .btn-volver:hover {
      background-color: #ad1457;
      box-shadow: 0 6px 10px rgba(0,0,0,0.3);
    }
    .btn-create {
      background-color: #38d15b;
      color: white;
    }
    .btn-edit {
      background-color: #ffc107;
      color: black;
    }
    .btn-delete {
      background-color: #dc3545;
      color: white;
    }
    .table th {
      background-color: #98e6eb;
      color: black;
    }
    .table-img {
      width: 80px;
      height: auto;
      border-radius: 0.25rem;
    }
    h2 {
      color: #333;
    }
    .pagination .page-link {
      color: #000;
    }
    .pagination .active .page-link {
      background-color: #000;
      border-color: #000;
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-rosa px-4">
    <a class="navbar-brand" href="#">Salones</a>
    <div class="ms-auto d-flex gap-2">
      <a href="/index.html" class="btn btn-volver">
        <i class="bi bi-house-fill"></i> Inicio
      </a>
      <a href="/pages/admin/menu.html" class="btn btn-volver">
        <i class="bi bi-arrow-left-square-fill"></i> Panel Admin
      </a>
    </div>
  </nav>

  <!-- Contenido -->
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <a href="/pages/admin/forms/form-salon.html" class="btn btn-create">
        <i class="bi bi-plus-circle"></i> Crear Salón
      </a>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover shadow text-center align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Capacidad</th>
            <th>Precio</th>
            <th>Imagen</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="salones-body">
          <!-- Aquí se insertan las filas dinámicamente -->
        </tbody>
      </table>
    </div>

    <!-- Paginación -->
    <nav class="d-flex justify-content-center mt-4">
      <ul class="pagination pagination-sm">
        <li class="page-item disabled"><a class="page-link" href="#">Anterior</a></li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
        <li class="page-item"><a class="page-link" href="#">Siguiente</a></li>
      </ul>
    </nav>
  </main>

  <script src="/js/admin-salon.js"></script>
</body>
</html>
